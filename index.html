<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BME EquipAI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f1f6f7;--card:#fff;--ink:#12262b;--mut:#5d7479;--line:#d9e5e7;--pri:#0f5c6e;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a1e;--card:#15262b;--ink:#e6f0f2;--mut:#93aab0;--line:#254049;--pri:#2bb5a0;--on:#06201c}}
:root[data-theme=dark]{--bg:#0d1a1e;--card:#15262b;--ink:#e6f0f2;--mut:#93aab0;--line:#254049;--pri:#2bb5a0;--on:#06201c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'IBM Plex Sans Thai',system-ui,sans-serif}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}p{margin:0 0 8px}.m{color:var(--mut);font-size:13px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 14px}
.logo{font-weight:600;color:var(--pri);white-space:nowrap}.logo b{display:inline-block;width:10px;height:10px;border-radius:50%;background:#17b5a0;margin-right:6px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}nav a{padding:6px 11px;border-radius:8px;white-space:nowrap;cursor:pointer;color:var(--mut);font-size:14px}nav a.on{background:var(--pri);color:var(--on)}
main{max-width:1060px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.st{background:var(--card);border:1px solid var(--line);border-left:5px solid currentColor;border-radius:10px;padding:10px 12px}.st b{display:block;font-size:28px;line-height:1.1;color:var(--ink)}.st span{color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:500;background:color-mix(in srgb,currentColor 15%,transparent)}
.Available,.Approved{color:#12a26b}.Reserved,.ReturnRequested{color:#2f7de1}.Borrowed,.Pending{color:#d98a0b}.Maintenance,.Rejected{color:#e0524a}.Retired,.Returned{color:#7b8b90}
button,.btn{font:inherit;background:var(--pri);color:var(--on);border:0;border-radius:8px;padding:7px 14px;cursor:pointer}button.s{background:transparent;color:var(--pri);border:1px solid var(--pri)}button.d{background:#e0524a;color:#fff}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #17b5a0;outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.row>button{flex:none}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:13px}tr.k{cursor:pointer}
.ai{border-left:4px solid #17b5a0;background:color-mix(in srgb,#17b5a0 10%,var(--card));border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14px}.ai.w{border-color:#d98a0b;background:color-mix(in srgb,#d98a0b 10%,var(--card))}.ai.e{border-color:#e0524a;background:color-mix(in srgb,#e0524a 10%,var(--card))}
.bar{height:10px;border-radius:5px;background:currentColor}.bt{background:var(--line);border-radius:5px;margin:3px 0 9px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;display:none;z-index:9}
.login{max-width:420px;margin:8vh auto;padding:0 14px}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),V=id=>document.getElementById(id).value;
const iso=d=>d.toISOString().slice(0,10),addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const TY={ECG:['ECG',/ecg|คลื่นหัวใจ|หัวใจ/i,'บันทึกสัญญาณไฟฟ้าหัวใจ เหมาะกับแล็บ ECG'],PM:['Patient Monitor',/monitor|มอนิเตอร์|สัญญาณชีพ|vital/i,'แสดงสัญญาณชีพหลายค่าพร้อมกัน เช่น HR, SpO2, NIBP'],SPO2:['Pulse Oximeter',/spo2|oximeter|ออกซิเจน|ชีพจร|pulse/i,'วัดค่า SpO2 และอัตราชีพจร พกพาสะดวก'],BP:['Blood Pressure Monitor',/\bbp\b|ความดัน|blood pressure/i,'วัดความดันโลหิตแบบ NIBP'],INF:['Infusion Pump',/infusion|pump|ปั๊ม|สารน้ำ/i,'ฝึกควบคุมอัตราการไหลของสารน้ำ']};
const LB={Available:'พร้อมใช้งาน',Reserved:'ถูกจอง',Borrowed:'กำลังถูกยืม',Maintenance:'ตรวจสอบ/ซ่อมบำรุง',Retired:'เลิกใช้งาน',Pending:'รออนุมัติ',Approved:'อนุมัติแล้ว',Rejected:'ปฏิเสธ',ReturnRequested:'ขอคืนแล้ว',Returned:'คืนแล้ว'};
// ===== ตั้งค่า Supabase: แก้ 2 ค่านี้ (Project Settings > API) =====
const SUPABASE_URL='https://telivplmazlmbwqagsqp.supabase.co',SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlbGl2cGxtYXpsbWJ3cWFnc3FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDEwODUsImV4cCI6MjEwNzE3NzA4NX0.LfkEfb2RSFInIx1U-EibW0_0ajNYoRfwWkxgL3mVFck';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S={role:null,page:'login',deep:null,uid:null,eq:[],rq:[],mt:[],iss:[]};const save=()=>{};
const log=(id,t)=>sb.from('equipment_log').insert({equipment_id:id,note:t});
async function ex(...q){for(const x of q){const{error}=await x;if(error){toast('ผิดพลาด: '+error.message);return false}}await load();return true}
async function load(){
 const[a,b,c,d]=await Promise.all([sb.from('equipment').select('*').order('id'),sb.from('requests').select('*,profiles(full_name)').order('id'),sb.from('maintenance').select('*').order('id',{ascending:false}),sb.from('equipment_log').select('*').order('id',{ascending:false})]);
 const er=[a,b,c,d].find(x=>x.error);if(er){toast('โหลดข้อมูลไม่สำเร็จ: '+er.error.message);return}
 const lg={};d.data.forEach(x=>(lg[x.equipment_id]=lg[x.equipment_id]||[]).push({d:x.created_at.slice(0,10),t:x.note}));
 S.eq=a.data.map(x=>({id:x.id,t:x.type,name:x.name,sn:x.serial||'',loc:x.location||'',st:x.status,desc:x.description||'-',h:lg[x.id]||[]}));
 S.rq=b.data.map(x=>({id:x.id,u:(x.profiles&&x.profiles.full_name)||'-',t:x.type,q:x.qty,d:x.req_date,s:x.start_time.slice(0,5),e:x.end_time.slice(0,5),p:x.purpose,st:x.status,units:x.units||[]}));
 S.mt=c.data.map(x=>({mid:x.id,id:x.equipment_id,d:x.created_at.slice(0,10),n:(x.category?'['+x.category+'] ':'')+(x.note||''),st:x.status}));
 S.iss=c.data.filter(x=>x.reported_by==S.uid).map(x=>({id:x.equipment_id,c:x.category,t:x.note,u:S.name}))}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){render();return}
 S.uid=session.user.id;const{data:p}=await sb.from('profiles').select('*').eq('id',S.uid).single();
 if(!p){toast('ไม่พบโปรไฟล์ผู้ใช้');await sb.auth.signOut();render();return}
 S.role=p.role;S.name=p.full_name;await load();const d=S.deep,ok=d&&E(d);S.deep=null;go(ok?'detail':S.role=='staff'?'adash':'sdash',ok?d:undefined)}
async function signIn(){const{error}=await sb.auth.signInWithPassword({email:V('em'),password:V('pw')});if(error){toast('เข้าสู่ระบบไม่ได้: '+error.message);return}boot()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.x);t.x=setTimeout(()=>t.style.display='none',2200)}
const E=id=>S.eq.find(x=>x.id==id),cnt=s=>S.eq.filter(x=>x.st==s).length,pill=s=>`<span class="pill ${s}">${LB[s]||s}</span>`;
const AI={
 parse(t){const r={};for(const k in TY)if(TY[k][1].test(t)){r.t=k;break}
  let m=t.match(/(\d+)\s*(เครื่อง|ชิ้น|ตัว|unit)/i)||t.match(/(?:ต้องการ|ขอ)\D{0,20}?(\d+)/);r.q=m?+m[1]:1;
  r.d=/มะรืน/.test(t)?addD(2):/พรุ่งนี้/.test(t)?addD(1):/วันนี้/.test(t)?addD(0):(t.match(/\d{4}-\d{2}-\d{2}/)||[addD(1)])[0];
  m=t.match(/(\d{1,2})[:.](\d{2})\s*(?:-|–|ถึง|to)\s*(\d{1,2})[:.](\d{2})/);if(m){r.s=m[1].padStart(2,'0')+':'+m[2];r.e=m[3].padStart(2,'0')+':'+m[4]}
  m=t.match(/((?:lab|อบรม|ฝึก)[^,.\d]*?)(?=\s*(ต้องการ|ขอ|เวลา|$))/i)||t.match(/(?:สำหรับ|เพื่อ)\s*(.+)/);r.p=m?(m[1]||m[0]).trim():'';return r},
 rec(t){return Object.keys(TY).filter(k=>TY[k][1].test(t))},
 cls(t){const c=[['Display Issue',/จอ|display|screen|แสดงผล/i],['Sensor Issue',/sensor|เซนเซอร์|probe|สาย|lead|cuff|ข้อต่อ/i],['Power/Battery Issue',/แบต|battery|ชาร์จ|เปิดไม่ติด|ไฟ/i],['Physical Damage',/แตก|ร้าว|ตก|หัก|เสียหาย/i],['Measurement Issue',/ค่า|วัด|คลาดเคลื่อน|ผิดปกติ|อ่าน/i]];const f=c.find(x=>x[1].test(t));return f?f[0]:'Other'},
 rev(r){const av=S.eq.filter(x=>x.t==r.t&&x.st=='Available').length,tot=S.eq.filter(x=>x.t==r.t&&x.st!='Retired').length;
  const ov=S.rq.filter(x=>x.id!=r.id&&x.t==r.t&&x.d==r.d&&['Pending','Approved'].includes(x.st)&&x.s<r.e&&r.s<x.e);const oq=ov.reduce((a,x)=>a+x.q,0);
  if(r.q>av)return{c:'e',m:`เครื่องมือไม่เพียงพอ: ต้องการ ${r.q} เครื่อง แต่พร้อมใช้งาน ${av} จากทั้งหมด ${tot} เครื่อง ควรพิจารณาปฏิเสธหรือขอให้ปรับจำนวน`};
  if(r.s>=r.e)return{c:'e',m:'ช่วงเวลาไม่ถูกต้อง: เวลาสิ้นสุดต้องหลังเวลาเริ่ม'};
  if(ov.length&&r.q+oq>av)return{c:'w',m:`พบคำขอซ้อนช่วงเวลาเดียวกัน ${ov.length} รายการ (รวมต้องการ ${r.q+oq} เครื่อง แต่พร้อมใช้ ${av}) ควรตรวจสอบก่อนอนุมัติ`};
  return{c:'',m:`มีเครื่องมือเพียงพอ (พร้อมใช้ ${av}/${tot}) และไม่พบการจองซ้ำที่เกินจำนวน สามารถพิจารณาอนุมัติได้`}}};
const aibox=x=>`<div class="ai ${x.c||''}"><b>AI แนะนำ</b> · ${x.m}<div class="m">AI เป็นเพียงผู้ช่วยวิเคราะห์ การตัดสินใจเป็นหน้าที่ของเจ้าหน้าที่</div></div>`;
function go(p,x){S.page=p;if(x!==undefined)S.sel=x;save();render();scrollTo(0,0)}
async function out(){await sb.auth.signOut();S.role=null;S.page='login';render()}
const NAV={medical:[['sdash','Dashboard'],['list','เครื่องมือ'],['borrow','ขอยืม'],['my','คำขอของฉัน'],['ai','AI Assistant']],staff:[['adash','Dashboard'],['approve','อนุมัติคำขอ'],['manage','จัดการเครื่องมือ'],['return','รับคืน/ตรวจสภาพ'],['maint','ประวัติบำรุงรักษา'],['list','รายการ']]};
const st=(l,n,c)=>`<div class="st ${c||''}"><b>${n}</b><span>${l}</span></div>`;
const tname=k=>TY[k][0],mine=()=>S.rq.filter(r=>r.u==S.name);
function reqRow(r,act){return`<tr><td>${tname(r.t)} × ${r.q}</td><td>${r.d}<br><span class="m">${r.s}-${r.e}</span></td><td>${r.p||'-'}<br><span class="m">${r.u}</span></td><td>${pill(r.st)}</td><td>${act||''}</td></tr>`}
const th='<tr><th>เครื่องมือ</th><th>วันที่/เวลา</th><th>วัตถุประสงค์/ผู้ขอ</th><th>สถานะ</th><th></th></tr>';
const P={
login:()=>'',
sdash:()=>`<h1>สวัสดี ${S.name}</h1><p class="m">ตรวจสอบสถานะเครื่องมือและติดตามคำขอของคุณ</p><div class="g4">${st('พร้อมใช้งาน',cnt('Available'),'Available')}${st('คำขอทั้งหมดของฉัน',mine().length,'Reserved')}${st('กำลังยืม',mine().filter(r=>r.st=='Borrowed').length,'Borrowed')}${st('รออนุมัติ',mine().filter(r=>r.st=='Pending').length,'Pending')}</div>
<div class="card"><h2>เครื่องมือตามประเภท</h2><div class="g2">${Object.keys(TY).map(k=>{const a=S.eq.filter(x=>x.t==k&&x.st=='Available').length,t=S.eq.filter(x=>x.t==k&&x.st!='Retired').length;return`<div class="row"><div><b>${tname(k)}</b><div class="m">พร้อมใช้ ${a} / ${t}</div></div><button class="s" onclick="S.pre={t:'${k}'};go('borrow')">ขอยืม</button></div>`}).join('')}</div></div>
<div class="card"><h2>คำขอล่าสุด</h2><div class="tw"><table>${th}${mine().slice(-3).map(r=>reqRow(r)).join('')||'<tr><td colspan=5 class="m">ยังไม่มีคำขอ ลองสร้างคำขอแรกจากเมนูขอยืม</td></tr>'}</table></div></div>`,
list:()=>`<h1>รายการเครื่องมือแพทย์</h1><div class="card row"><input id="q" placeholder="ค้นหาชื่อ รหัส หรือ Serial" oninput="fl()"><select id="ft" onchange="fl()"><option value="">ทุกประเภท</option>${Object.keys(TY).map(k=>`<option value="${k}">${tname(k)}</option>`)}</select><select id="fs" onchange="fl()"><option value="">ทุกสถานะ</option>${Object.keys(LB).slice(0,5).map(k=>`<option value="${k}">${LB[k]}</option>`)}</select></div><div class="card tw" id="res"></div>`,
detail:()=>{const e=E(S.sel);if(!e)return'<p>ไม่พบเครื่องมือ</p>';const sf=S.role=='staff';return`<button class="s" onclick="go('list')">‹ กลับ</button><div class="g2" style="margin-top:10px"><div class="card"><h1>${e.name}</h1><p>${pill(e.st)} <span class="m">${e.id}</span></p><table><tr><th>Serial</th><td>${e.sn}</td></tr><tr><th>ประเภท</th><td>${tname(e.t)}</td></tr><tr><th>สถานที่เก็บ</th><td>${e.loc}</td></tr><tr><th>รายละเอียด</th><td>${e.desc}</td></tr></table>
${sf?`<label>เปลี่ยนสถานะ</label><div class="row"><select id="ns">${Object.keys(LB).slice(0,5).map(k=>`<option ${k==e.st?'selected':''}>${k}</option>`)}</select><button onclick="setSt('${e.id}',V('ns'))">บันทึก</button></div>`:`<div class="row" style="margin-top:10px"><button onclick="S.pre={t:'${e.t}'};go('borrow')" ${e.st!='Available'?'disabled':''}>ขอยืมเครื่องนี้</button></div>`}</div>
<div class="card" style="text-align:center"><h2>QR Code ${e.id}</h2><div id="qr" style="display:inline-block;background:#fff;padding:8px"></div><p class="m">สแกนเพื่อเปิดหน้านี้และดูสถานะล่าสุด</p></div></div>
${S.role=='medical'?`<div class="card"><h2>แจ้งปัญหาเครื่องมือ</h2><textarea id="is" rows="2" placeholder="เช่น หน้าจอกระพริบ หรือสาย lead หลวม"></textarea><div class="row" style="margin-top:8px"><button class="s" onclick="isAI()">ให้ AI จัดหมวดหมู่</button><button onclick="isSend('${e.id}')">ส่งแจ้งปัญหา</button></div><div id="isr"></div></div>`:''}
<div class="card"><h2>ประวัติการใช้งาน</h2>${e.h.map(x=>`<div class="m">${x.d} · <span style="color:var(--ink)">${x.t}</span></div>`).join('')}</div>`},
borrow:()=>{const p=S.pre||{};return`<h1>สร้างคำขอเบิก/ยืม</h1><div class="card"><h2>บอก AI เป็นภาษาธรรมชาติ</h2><textarea id="nl" rows="2" placeholder="พรุ่งนี้มีอบรม ECG ต้องการ ECG 2 เครื่อง เวลา 09:00-12:00"></textarea><button style="margin-top:8px" onclick="nlFill()">ให้ AI กรอกฟอร์ม</button></div>
<div class="card"><label>เครื่องมือ</label><select id="bt">${Object.keys(TY).map(k=>`<option value="${k}" ${p.t==k?'selected':''}>${tname(k)}</option>`)}</select><div class="row"><div><label>จำนวน</label><input id="bq" type="number" min="1" value="${p.q||1}"></div><div><label>วันที่</label><input id="bd" type="date" value="${p.d||addD(1)}"></div><div><label>เริ่ม</label><input id="bs" type="time" value="${p.s||'09:00'}"></div><div><label>สิ้นสุด</label><input id="be" type="time" value="${p.e||'12:00'}"></div></div><label>วัตถุประสงค์</label><input id="bp" value="${p.p||''}" placeholder="เช่น อบรม ECG">
<div class="row" style="margin-top:12px"><button class="s" onclick="chk()">ให้ AI ตรวจสอบคำขอ</button><button onclick="sub()">ส่งคำขอ</button></div><div id="rv"></div></div>`},
my:()=>`<h1>คำขอและประวัติการยืม</h1><div class="card tw"><table>${th}${mine().slice().reverse().map(r=>reqRow(r,r.st=='Borrowed'?`<button class="s" onclick="rq(${r.id})">ขอคืน</button>`:'')).join('')||'<tr><td colspan=5 class="m">ยังไม่มีประวัติ</td></tr>'}</table></div><div class="card"><h2>ปัญหาที่แจ้ง</h2>${S.iss.filter(i=>i.u==S.name).map(i=>`<p>${i.id} · <b>${i.c}</b> · ${i.t}</p>`).join('')||'<p class="m">ยังไม่มีการแจ้งปัญหา</p>'}</div>`,
ai:()=>`<h1>AI Assistant</h1><p class="m">ผู้ช่วยแนะนำและจัดหมวดหมู่ ไม่วินิจฉัยโรค ไม่อนุมัติหรือสั่งซ่อมเอง</p><div class="g2"><div class="card"><h2>แนะนำเครื่องมือ</h2><textarea id="a1" rows="2" placeholder="ต้องการวัด SpO2 และชีพจร"></textarea><button style="margin-top:8px" onclick="a1()">แนะนำ</button><div id="r1"></div></div><div class="card"><h2>จัดหมวดหมู่ปัญหา</h2><textarea id="a2" rows="2" placeholder="จอแสดงผลกระพริบ"></textarea><button style="margin-top:8px" onclick="a2()">จัดหมวดหมู่</button><div id="r2"></div></div></div>`,
adash:()=>{const tot=S.eq.length,pc=S.rq.filter(r=>r.st=='Pending').length;return`<h1>ภาพรวมห้องปฏิบัติการ</h1><div class="g4">${st('เครื่องมือทั้งหมด',tot,'Reserved')}${st('พร้อมใช้งาน',cnt('Available'),'Available')}${st('กำลังถูกยืม',cnt('Borrowed'),'Borrowed')}${st('Maintenance',cnt('Maintenance'),'Maintenance')}${st('คำขอรออนุมัติ',pc,'Pending')}</div><div class="g2"><div class="card"><h2>สัดส่วนสถานะ</h2>${Object.keys(LB).slice(0,5).map(k=>`<div class="${k}"><span style="color:var(--ink)">${LB[k]} (${cnt(k)})</span><div class="bt"><div class="bar" style="width:${cnt(k)/tot*100}%"></div></div></div>`).join('')}</div><div class="card"><h2>งานที่รอดำเนินการ</h2><p>${pc} คำขอรออนุมัติ <button class="s" onclick="go('approve')">ตรวจสอบ</button></p><p>${S.rq.filter(r=>r.st=='Approved').length} รายการรอจ่ายเครื่อง</p><p>${S.rq.filter(r=>['Borrowed','ReturnRequested'].includes(r.st)).length} รายการรอรับคืน <button class="s" onclick="go('return')">ไปรับคืน</button></p></div></div>`},
approve:()=>{const pe=S.rq.filter(r=>r.st=='Pending'),ap=S.rq.filter(r=>r.st=='Approved');return`<h1>ตรวจสอบคำขอเบิก</h1>${pe.map(r=>`<div class="card"><b>${tname(r.t)} × ${r.q}</b> · ${r.u}<div class="m">${r.d} ${r.s}-${r.e} · ${r.p||'-'}</div>${aibox(AI.rev(r))}<div class="row" style="margin-top:10px"><button onclick="appr(${r.id})">อนุมัติ</button><button class="d" onclick="rej(${r.id})">ปฏิเสธ</button></div></div>`).join('')||'<div class="card m">ไม่มีคำขอที่รออนุมัติ</div>'}<h2>รอจ่ายเครื่องมือ</h2>${ap.map(r=>`<div class="card row"><div><b>${tname(r.t)} × ${r.q}</b> ${r.units.join(', ')}<div class="m">${r.u} · ${r.d}</div></div><button onclick="disp(${r.id})">บันทึกการจ่าย</button></div>`).join('')||'<p class="m">ไม่มีรายการ</p>'}`},
manage:()=>{const f=S.edit;const e=f&&f!='new'?E(f):{};return`<h1>จัดการเครื่องมือ</h1><button onclick="S.edit='new';render()">+ เพิ่มเครื่องมือ</button>${f?`<div class="card" style="margin-top:10px"><h2>${f=='new'?'เพิ่ม':'แก้ไข'}เครื่องมือ</h2><div class="row"><div><label>ชื่อ</label><input id="mn" value="${e.name||''}"></div><div><label>ประเภท</label><select id="mt">${Object.keys(TY).map(k=>`<option value="${k}" ${e.t==k?'selected':''}>${tname(k)}</option>`)}</select></div><div><label>Serial</label><input id="ms" value="${e.sn||''}"></div><div><label>สถานที่</label><input id="ml" value="${e.loc||''}"></div></div><label>รายละเอียด</label><input id="md" value="${e.desc||''}"><div class="row" style="margin-top:10px"><button onclick="saveEq()">บันทึก</button><button class="s" onclick="S.edit=null;render()">ยกเลิก</button></div></div>`:''}<div class="card tw" style="margin-top:12px"><table><tr><th>รหัส</th><th>ชื่อ</th><th>Serial</th><th>สถานะ</th><th></th></tr>${S.eq.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.sn}</td><td>${pill(x.st)}</td><td><button class="s" onclick="S.edit='${x.id}';render()">แก้ไข</button> <button class="s" onclick="delEq('${x.id}')">ลบ</button></td></tr>`).join('')}</table></div>`},
return:()=>{const l=S.rq.filter(r=>['Borrowed','ReturnRequested'].includes(r.st));return`<h1>รับคืนและตรวจสภาพ</h1>${l.map(r=>`<div class="card"><b>${tname(r.t)} × ${r.q}</b> ${pill(r.st)}<div class="m">${r.u} · เครื่อง ${r.units.join(', ')||'-'}</div><div class="row" style="margin-top:8px"><select id="c${r.id}"><option value="ok">สภาพปกติ → Available</option><option value="bad">พบปัญหา → Maintenance</option></select><input id="n${r.id}" placeholder="บันทึกผลตรวจ"><button onclick="ret(${r.id})">รับคืน</button></div></div>`).join('')||'<div class="card m">ไม่มีรายการรอรับคืน</div>'}`},
maint:()=>`<h1>ประวัติการบำรุงรักษา</h1><div class="card tw"><table><tr><th>เครื่อง</th><th>วันที่</th><th>รายละเอียด</th><th>สถานะ</th><th></th></tr>${S.mt.map((m,i)=>`<tr><td>${m.id}</td><td>${m.d}</td><td>${m.n}</td><td>${m.st=='Open'?pill('Maintenance'):pill('Available')}</td><td>${m.st=='Open'?`<button class="s" onclick="fix(${i})">ตรวจเสร็จ</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5 class="m">ยังไม่มีบันทึก</td></tr>'}</table></div>`};
function Login(){const bad=SUPABASE_URL.includes('xxxx');return`<div class="login"><div class="card"><div class="logo" style="font-size:22px"><b></b>BME EquipAI</div><p class="m">ระบบเบิก ยืม คืน และจัดการเครื่องมือแพทย์อัจฉริยะ สำหรับห้องปฏิบัติการ Biomedical Engineering</p>${bad?'<div class="ai e">ยังไม่ได้ตั้งค่า Supabase: แก้ 2 บรรทัดแรกของสคริปต์ใน index.html</div>':''}<label>อีเมล</label><input id="em" type="email" autocomplete="email"><label>รหัสผ่าน</label><input id="pw" type="password" autocomplete="current-password"><div class="row" style="margin-top:14px"><button onclick="signIn()">เข้าสู่ระบบ</button></div><p class="m" style="margin-top:12px">ใช้ข้อมูลตัวอย่างเท่านั้น ไม่มีข้อมูลผู้ป่วยจริง และไม่ใช้เพื่อวินิจฉัยโรค</p></div></div>`}
function render(){const a=$('#app');if(!S.role){a.innerHTML=Login();return}
 a.innerHTML=`<header><div class="logo"><b></b>EquipAI</div><nav>${NAV[S.role].map(n=>`<a class="${S.page==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}</nav><button class="s" onclick="out()">ออก</button></header><main>${P[S.page]()}</main>`;
 if(S.page=='list')fl();if(S.page=='detail'){try{new QRCode($('#qr'),{text:location.href.split('#')[0]+'#eq='+S.sel,width:130,height:130})}catch(e){$('#qr').textContent=S.sel}}}
function fl(){const q=(V('q')||'').toLowerCase(),t=V('ft'),s=V('fs');S.q=0;const l=S.eq.filter(x=>(!t||x.t==t)&&(!s||x.st==s)&&(x.id+x.name+x.sn).toLowerCase().includes(q));
 $('#res').innerHTML=`<table><tr><th>รหัส</th><th>ชื่อ</th><th>ที่เก็บ</th><th>สถานะ</th></tr>${l.map(x=>`<tr class="k" onclick="go('detail','${x.id}')"><td><b>${x.id}</b></td><td>${x.name}</td><td>${x.loc}</td><td>${pill(x.st)}</td></tr>`).join('')||'<tr><td colspan=4 class="m">ไม่พบเครื่องมือ ลองเปลี่ยนคำค้นหาหรือตัวกรอง</td></tr>'}</table>`}
function rd(){return{t:V('bt'),q:+V('bq'),d:V('bd'),s:V('bs'),e:V('be'),p:V('bp')}}
function nlFill(){const r=AI.parse(V('nl'));if(!r.t){toast('AI ไม่พบชนิดเครื่องมือ ลองระบุชื่อให้ชัดขึ้น');return}S.pre=r;render();$('#rv').innerHTML=aibox({c:'',m:`แปลงข้อความเป็น: ${tname(r.t)} × ${r.q} วันที่ ${r.d} เวลา ${r.s||'09:00'}-${r.e||'12:00'} วัตถุประสงค์ "${r.p||'-'}" กรุณาตรวจทานก่อนส่ง`})}
function chk(){const r=rd();S.pre=r;$('#rv').innerHTML=aibox(AI.rev({...r,id:0}))}
async function sub(){const r=rd();if(!r.q||!r.d||!r.p){toast('กรอกจำนวน วันที่ และวัตถุประสงค์ให้ครบ');return}if(await ex(sb.from('requests').insert({type:r.t,qty:r.q,req_date:r.d,start_time:r.s,end_time:r.e,purpose:r.p}))){S.pre=null;toast('ส่งคำขอแล้ว รอเจ้าหน้าที่ตรวจสอบ');go('my')}}
async function rq(id){if(await ex(sb.from('requests').update({status:'ReturnRequested'}).eq('id',id)))toast('ส่งคำขอคืนแล้ว');go('my')}
function isAI(){$('#isr').innerHTML=aibox({c:'w',m:`หมวดหมู่: <b>${AI.cls(V('is'))}</b> · แนะนำให้ส่งเครื่องเข้าตรวจสอบโดยเจ้าหน้าที่`})}
async function isSend(id){const t=V('is');if(!t){toast('อธิบายปัญหาก่อนส่ง');return}if(await ex(sb.from('maintenance').insert({equipment_id:id,category:AI.cls(t),note:t})))toast('ส่งเรื่องให้เจ้าหน้าที่ตรวจสอบแล้ว');go('detail',id)}
function a1(){const k=AI.rec(V('a1'));$('#r1').innerHTML=k.length?k.map(x=>aibox({c:'',m:`<b>${tname(x)}</b>: ${TY[x][2]} <button class="s" onclick="S.pre={t:'${x}'};go('borrow')">ขอยืม</button>`})).join(''):aibox({c:'w',m:'ยังไม่พบเครื่องมือที่ตรงกับความต้องการ ลองระบุสิ่งที่ต้องการวัด'})}
function a2(){$('#r2').innerHTML=aibox({c:'w',m:`หมวดหมู่: <b>${AI.cls(V('a2'))}</b> · แนะนำให้ส่งเข้าตรวจสอบ (AI ไม่วินิจฉัยหรือสั่งซ่อมอัตโนมัติ)`})}
async function appr(id){const r=S.rq.find(x=>x.id==id),u=S.eq.filter(x=>x.t==r.t&&x.st=='Available').slice(0,r.q).map(x=>x.id);if(u.length<r.q){toast('เครื่องมือไม่พอ ไม่สามารถอนุมัติได้');return}
 if(await ex(sb.from('equipment').update({status:'Reserved'}).in('id',u),sb.from('requests').update({status:'Approved',units:u}).eq('id',id),...u.map(i=>log(i,'จองให้ '+r.u))))toast('อนุมัติแล้ว');go('approve')}
async function rej(id){if(await ex(sb.from('requests').update({status:'Rejected'}).eq('id',id)))toast('ปฏิเสธคำขอแล้ว');go('approve')}
async function disp(id){const r=S.rq.find(x=>x.id==id);if(await ex(sb.from('equipment').update({status:'Borrowed'}).in('id',r.units),sb.from('requests').update({status:'Borrowed'}).eq('id',id),...r.units.map(i=>log(i,'จ่ายให้ '+r.u))))toast('บันทึกการจ่ายแล้ว');go('approve')}
async function ret(id){const r=S.rq.find(x=>x.id==id),bad=V('c'+id)=='bad',n=V('n'+id),us=r.units;
 const q=[sb.from('equipment').update({status:bad?'Maintenance':'Available'}).in('id',us),sb.from('requests').update({status:'Returned'}).eq('id',id),...us.map(i=>log(i,'รับคืนจาก '+r.u+': '+(bad?'พบปัญหา '+n:'สภาพปกติ')))];
 if(bad&&us.length)q.push(sb.from('maintenance').insert(us.map(i=>({equipment_id:i,note:n||'พบปัญหาหลังคืน'}))));
 if(await ex(...q))toast(bad?'ส่งเข้า Maintenance':'คืนสถานะ Available');go('return')}
async function fix(i){const m=S.mt[i],q=[sb.from('maintenance').update({status:'Done'}).eq('id',m.mid)];if(E(m.id)&&E(m.id).st=='Maintenance')q.push(sb.from('equipment').update({status:'Available'}).eq('id',m.id),log(m.id,'ตรวจสอบเสร็จ: พร้อมใช้งาน'));if(await ex(...q))toast('อัปเดตแล้ว');go('maint')}
async function setSt(id,s){const q=[sb.from('equipment').update({status:s}).eq('id',id),log(id,'เปลี่ยนสถานะเป็น '+s)];if(s=='Maintenance')q.push(sb.from('maintenance').insert({equipment_id:id,note:'ส่งตรวจสอบโดยเจ้าหน้าที่'}));if(await ex(...q))toast('เปลี่ยนสถานะแล้ว');go('detail',id)}
async function saveEq(){const t=V('mt'),o={type:t,name:V('mn'),serial:V('ms'),location:V('ml'),description:V('md')};if(!o.name){toast('กรอกชื่อเครื่องมือ');return}
 let q;if(S.edit=='new'){let n=S.eq.filter(x=>x.t==t).length+1;while(E(t+'-'+String(n).padStart(3,'0')))n++;q=sb.from('equipment').insert({...o,id:t+'-'+String(n).padStart(3,'0')})}else q=sb.from('equipment').update(o).eq('id',S.edit);
 if(await ex(q)){S.edit=null;toast('บันทึกแล้ว')}go('manage')}
async function delEq(id){if(await ex(sb.from('equipment').delete().eq('id',id)))toast('ลบ '+id+' แล้ว');go('manage')}
const m=location.hash.match(/eq=([\w-]+)/);if(m)S.deep=m[1];
boot();
</script></body></html>
